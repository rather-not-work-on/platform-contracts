name: Contracts Check

on:
  pull_request:
    paths:
      - "schemas/**"
      - "fixtures/**"
      - "scripts/**"
      - "compatibility/**"
      - "requirements-dev.txt"
      - ".github/workflows/contracts-check.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/**"
      - "fixtures/**"
      - "scripts/**"
      - "compatibility/**"
      - "requirements-dev.txt"
      - ".github/workflows/contracts-check.yml"
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements-dev.txt

      - name: Validate C1~C8 fixtures with JSON Schema
        run: python3 scripts/validate_contracts.py --root .

      - name: Run strict regression fixtures
        run: python3 scripts/test_validate_contracts_strict.py

      - name: Enforce SemVer scenario expectations
        run: python3 scripts/classify_schema_change.py --enforce-expected

      - name: Verify SemVer rationale contract
        run: python3 scripts/test_classify_schema_change_diff.py
