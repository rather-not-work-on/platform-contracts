name: Contracts Compatibility Check

on:
  pull_request:
    paths:
      - "schemas/**"
      - "fixtures/**"
      - "compatibility/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - ".github/workflows/contracts-compatibility-check.yml"
  workflow_dispatch:

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements-dev.txt

      - name: Validate C1~C8 fixtures
        run: python3 scripts/validate_contracts.py --root .

      - name: Classify semver impact scenarios
        run: python3 scripts/classify_schema_change.py --enforce-expected

      - name: Verify semver rationale contract
        run: python3 scripts/test_classify_schema_change_diff.py

      - name: Verify contract bundle publication regression
        run: python3 scripts/test_publish_contract_bundle.py

      - name: Upload compatibility reports
        uses: actions/upload-artifact@v4
        with:
          name: contracts-compatibility-reports
          path: compatibility/reports/*.json
